<style>
:root{--bg:#f4f6f6;--card:#fff;--text:#172024;--muted:#5d6b72;--line:#dde4e6;--accent:#1f7a8c;--accent-soft:#e3f1f3;--ok:#2e8b57;--p:#c2553f;--c:#b8860b;--f:#6b5fb5;--nav:rgba(255,255,255,.94)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1416;--card:#1a2226;--text:#e8eeef;--muted:#96a5ab;--line:#2b363b;--accent:#5cc0d2;--accent-soft:#17323a;--ok:#5fc48c;--p:#ee8d79;--c:#e2b64a;--f:#a79df0;--nav:rgba(20,27,30,.94)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow-x:hidden}
main{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) max(14px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 96px) max(14px,env(safe-area-inset-left))}
h1{font-size:26px;margin:4px 0 2px;letter-spacing:-.3px}
h2{font-size:18px;margin:22px 0 8px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:16px 0 6px}
p{margin:6px 0}
.sub{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.tab{display:none}.tab.on{display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0}
.days button{min-height:48px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px}
.days button.on{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.days button.on{color:#06181c}}
.days button.today:not(.on){border-color:var(--accent);color:var(--accent)}
.big{font-size:30px;font-weight:700;letter-spacing:-.5px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--accent);width:0;transition:width .25s}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.mgrid b{font-size:17px}.mgrid span{font-size:12px;color:var(--muted);display:block}
.slot{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.slot:first-child{border-top:0}
.slot .time{flex:0 0 68px;font-size:13px;font-weight:600;color:var(--muted);padding-top:3px}
.slot .body{flex:1;min-width:0}
.slot .name{font-weight:600}
.slot.mark .name{font-weight:500;color:var(--muted);font-size:14px}
.slot.done .name{text-decoration:line-through;color:var(--muted)}
.mac{font-size:13px;color:var(--muted);margin-top:2px}
.mac b{color:var(--text);font-weight:600}
.link{color:var(--accent);font-size:14px;font-weight:600;display:inline-block;padding:8px 0 2px}
.chk{flex:0 0 34px;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;color:transparent;margin-top:2px}
.on>.chk,.done>.chk{background:var(--ok);border-color:var(--ok);color:#fff}
.rhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;width:100%;text-align:left;min-height:48px}
.rhead .name{font-weight:650;font-size:16px}
.rhead .arrow{color:var(--muted);font-size:20px;line-height:1.2}
.tag{display:inline-block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 7px;margin-bottom:4px}
.rbody{display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.open>.rbody{display:block}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent-soft);border-radius:12px;padding:8px 12px}
.step button{width:48px;height:48px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:24px;font-weight:600}
.step .n{font-weight:700;font-size:18px;text-align:center}
.step .n small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.ing{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.ing:first-of-type{border-top:0}
.ing .q{flex:0 0 46%;text-align:right;color:var(--muted);font-size:14px}
.ing .q b{color:var(--text)}
.ing small{display:block;color:var(--muted);font-size:12.5px}
ol{padding-left:22px;margin:6px 0}ol li{margin:8px 0}
.note{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
.item{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:11px 0;border-top:1px solid var(--line);min-height:52px}
.item:first-child{border-top:0}
.item .body{flex:1;min-width:0}
.item.on .t{text-decoration:line-through;color:var(--muted)}
.item .d{font-size:13.5px;color:var(--muted);margin-top:2px}
.item .when{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.3px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.reset{font-size:14px;font-weight:600;color:var(--accent);min-height:44px;padding:0 4px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{text-align:left;padding:8px 6px 8px 0;border-top:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;border-top:0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--nav);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav div{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{min-height:58px;font-size:11.5px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent)}
</style>

 ing:[I('egg',150,3,'large'),I('oil',4.5,1,'tsp'),I('sourdough',99,2,'slices'),I('spread',24,4,'tsp'),I('oj',200,200,'ml','a small glass'),S('Green onion, thinly sliced',1,'tbsp'),S('Kosher salt',null,'pinch'),S('Black pepper',null,'to taste')],

/* ---------- maths ---------- */
function macros(r,s){s=s||1;const m={k:0,p:0,c:0,f:0};r.ing.forEach(i=>{if(!i.f||!i.g)return;const d=FOOD[i.f],x=i.g*s/100;m.k+=d[1]*x;m.p+=d[2]*x;m.c+=d[3]*x;m.f+=d[4]*x});return m}
const R={};RECIPES.forEach(r=>R[r.id]=r);
function dayTotal(d,only){const m={k:0,p:0,c:0,f:0};plan(d).forEach((s,i)=>{if(!s.id||(only&&!only[i]))return;const x=macros(R[s.id]);for(const k in m)m[k]+=x[k]});return m}
function frac(x){if(x>=20)return String(Math.round(x));let w=Math.floor(x+1e-9),r=x-w,best=0,bd=9;const F=[[0,''],[.125,'⅛'],[.25,'¼'],[.333,'⅓'],[.5,'½'],[.667,'⅔'],[.75,'¾'],[1,'']];F.forEach((f,i)=>{const d=Math.abs(r-f[0]);if(d<bd){bd=d;best=i}});if(best===7){w++;best=0}if(w===0&&best===0)return'⅛';return(w?w:'')+F[best][1]}
function house(q,u){if(q==null)return u;if(u==='tsp'&&q>=3){q/=3;u='tbsp'}if(u==='tbsp'&&q>=4){q/=16;u='cup'}if(u==='cup'&&q>1.01)u='cups';const PL={clove:'cloves',breast:'breasts',stalk:'stalks',lime:'limes',lemon:'lemons',fillet:'fillets',bagel:'bagels',roma:'romas'};if(PL[u]&&q>1.01)u=PL[u];if(u==='cups'&&q<=1.01)u='cup';return frac(q)+' '+u}
function grams(g){return g>=10?Math.round(g):Math.round(g*10)/10}

const macLine=m=>`<b>${n0(m.k)}</b> kcal · <b>${n0(m.p)}</b> g protein · <b>${n0(m.c)}</b> g carbs · <b>${n0(m.f)}</b> g fat`;
function renderToday(){
 const slots=plan(day),chk=(eaten[day]||{}).c||{},tot=dayTotal(day),got=dayTotal(day,chk);
 const bar=(label,v,t,col,unit)=>`<div><span>${label}</span><b>${n0(v)}</b><span>of ${n0(t)}${unit}</span><div class="bar"><i style="width:${Math.min(100,v/t*100)}%;background:var(${col})"></i></div></div>`;
